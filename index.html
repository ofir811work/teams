<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2947">
<title>כוחות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="כוחות">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg1:#0d2947;--bg2:#17457a;--accent:#39b4ff;
 --card:#ffffff;--ink:#15293f;--muted:#6b7a8d;--line:#eef2f7;
 --blue:#4389d8;--red:#db5460;--yellow:#e3b82b;--orange:#e69533;--white:#a6b2c2;
 --shadow:0 12px 34px rgba(5,20,40,.22);
 --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{margin:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);min-height:100vh;
 background:radial-gradient(120% 80% at 50% 0%,#1b4e86 0%,var(--bg1) 60%);background-attachment:fixed;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:calc(14px + var(--safe-top)) 16px calc(70px + var(--safe-bot))}

/* top bar */
.topbar{display:flex;justify-content:flex-start;align-items:center;min-height:40px}
.gear{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.gear:active{transform:scale(.92)}
.gear:hover{background:rgba(255,255,255,.26)}

/* hero */
.hero{text-align:center;color:#fff;margin:2px 0 18px;animation:fadeDown .5s ease both}
.badge-ball{width:74px;height:74px;margin:0 auto 8px;border-radius:22px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#1d4e86,#0d2947);box-shadow:0 8px 22px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);font-size:38px}
.hero h1{font-size:clamp(25px,7vw,36px);margin:4px 0 2px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .round{font-size:16px;font-weight:700;color:#bfe0ff;opacity:.95}
.hero .date{font-size:14px;opacity:.75;margin-top:3px}

/* countdown */
.countdown{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(57,180,255,.18),rgba(255,255,255,.08));
 border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:18px;padding:16px 18px;margin:0 auto 20px;max-width:440px;text-align:center;
 backdrop-filter:blur(6px);animation:fadeUp .5s .05s ease both}
.countdown .label{font-size:14.5px;opacity:.92;letter-spacing:.2px;line-height:1.5}
.countdown .label b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.countdown .timer{display:flex;align-items:flex-start;justify-content:center;gap:4px;margin-top:10px}
.countdown .seg{display:flex;flex-direction:column;align-items:center;min-width:58px}
.countdown .seg .num{font-size:36px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:#fff;text-shadow:0 2px 14px rgba(57,180,255,.45)}
.countdown .seg .cap{font-size:11px;opacity:.75;margin-top:5px;letter-spacing:.3px}
.countdown .colon{font-size:30px;font-weight:800;line-height:1;padding-top:2px;opacity:.6}
.countdown .pulse{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0%,rgba(57,180,255,.25),transparent);pointer-events:none}

/* cards */
.card{background:var(--card);border-radius:20px;padding:18px 16px;margin:14px 0;box-shadow:var(--shadow);animation:fadeUp .45s ease both}
.card h2{margin:0 0 14px;font-size:20px;text-align:center;color:var(--bg1);display:flex;align-items:center;justify-content:center;gap:8px}
.card h2 .ico{font-size:19px}
.section-tag{display:block;text-align:center;font-size:13px;color:var(--muted);margin:4px 0}

/* roster */
.roster-list{list-style:none;margin:0;padding:0;counter-reset:n}
.roster-list li{counter-increment:n;display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:17px;animation:slideIn .4s ease both}
.roster-list li:last-child{border-bottom:0}
.roster-list li::before{content:counter(n);flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#eaf1fb,#dbe8fa);color:var(--bg2);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(67,137,216,.18)}
.guests h2{color:#9a6400}
.guests .roster-list li::before{background:linear-gradient(145deg,#fff2d6,#ffe6b3);color:#8a5a00;box-shadow:inset 0 0 0 1px rgba(224,160,40,.25)}

/* teams — זהה לתצוגת האדמין: קבוצה בצבע מלא, גבול צבעוני, שמות בצבע הקבוצה */
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.team{border:2px solid;border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 4px 14px rgba(0,0,0,.08);animation:popIn .4s ease both}
.team h3{margin:0;text-align:center;padding:12px 4px;font-size:16px;font-weight:800;border-bottom:2px solid currentColor}
.team.blue{background:#e5f0ff;color:#144a98;border-color:#4389d8}
.team.red{background:#ffe9e9;color:#a32232;border-color:#db5460}
.team.yellow{background:#fff5cb;color:#775800;border-color:#e3b82b}
.team.orange{background:#fff0da;color:#955000;border-color:#e69533}
.team.white{background:#fff;color:#3c4b5c;border-color:#a6b2c2}
.team .p{padding:10px 4px;text-align:center;color:inherit;border-bottom:1px solid rgba(160,160,160,.25);font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.team .p:last-child{border-bottom:0}

/* skeleton */
.skel{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.skel .bar{height:16px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,#eef2f7 25%,#e2e8f0 50%,#eef2f7 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.skel .bar.sm{width:50%;margin-inline:auto}

.empty{text-align:center;color:#fff;opacity:.9;padding:46px 14px;font-size:17px;line-height:1.6}
.empty .big{font-size:40px;display:block;margin-bottom:8px}
.foot{text-align:center;color:#ffffff9c;font-size:12px;margin-top:24px}

/* install banner */
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bot));max-width:460px;margin:0 auto;
 display:none;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:20;animation:fadeUp .4s ease both}
.install .ib{width:40px;height:40px;border-radius:11px;flex:0 0 auto}
.install .it{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.install .it small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.install button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
.install .yes{background:var(--bg2);color:#fff}
.install .no{background:transparent;color:var(--muted);padding:10px 6px}

/* update toast */
.update{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bot));max-width:460px;margin:0 auto;display:none;
 align-items:center;gap:10px;background:#17457a;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:21;animation:fadeUp .4s ease both}
.update button{margin-inline-start:auto;background:#fff;color:#17457a;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer}

/* dialog */
dialog{border:0;border-radius:18px;padding:22px;max-width:330px;width:88%;box-shadow:0 24px 60px #0006;animation:popIn .25s ease}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
dialog h3{margin:0 0 14px;text-align:center;color:var(--bg1)}
dialog input{width:100%;padding:13px;font-size:20px;text-align:center;border:1.5px solid #c4d0de;border-radius:12px;letter-spacing:6px}
dialog input:focus{outline:0;border-color:var(--accent)}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog button{flex:1;padding:12px;border:0;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer}
dialog .ok{background:var(--bg2);color:#fff}
dialog .cancel{background:#eef2f7;color:#415}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* במצב אפליקציה מותקנת (PWA) מסתירים את כניסת המנהל — זמינה בדפדפן בלבד */
@media(display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){.gear{display:none!important}}
body.standalone .gear{display:none!important}

@media(max-width:520px){
 main{padding:calc(12px + var(--safe-top)) 11px calc(60px + var(--safe-bot))}
 .team h3{font-size:13.5px;padding:10px 2px}
 .team .p{font-size:13px;padding:9px 2px}
 .teams{gap:7px}
 .roster-list li{font-size:16px}
}
</style></head><body><main>
<div class="topbar"><button class="gear" id="gear" title="כניסת מנהל" aria-label="כניסת מנהל">⚙️</button></div>

<div class="hero">
 <div class="badge-ball">⚽</div>
 <h1 id="title">כוחות</h1>
 <div class="round" id="round"></div>
 <div class="date" id="date"></div>
</div>

<div class="countdown" id="countdown" style="display:none">
 <div class="pulse"></div>
 <div class="label" id="drawLabel"></div>
 <div class="timer" id="timer">
  <div class="seg"><span class="num" id="tH">00</span><span class="cap">שעות</span></div>
  <div class="colon">:</div>
  <div class="seg"><span class="num" id="tM">00</span><span class="cap">דקות</span></div>
  <div class="colon">:</div>
  <div class="seg"><span class="num" id="tS">00</span><span class="cap">שניות</span></div>
 </div>
</div>

<div id="content"><div class="skel"><div class="bar sm"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>

<div class="foot">גרסה 43 · מתעדכן אוטומטית</div>
</main>

<div class="install" id="install">
 <img class="ib" src="icon-192.png" alt="">
 <div class="it">התקן כאפליקציה<small>גישה מהירה ממסך הבית</small></div>
 <button class="yes" id="installYes">התקן</button>
 <button class="no" id="installNo">לא עכשיו</button>
</div>

<div class="update" id="updateBar"><span>יש גרסה חדשה 🎉</span><button id="updateBtn">רענן</button></div>

<dialog id="pwDialog">
 <h3>🔒 כניסת מנהל</h3>
 <input id="pwInput" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
 <div class="row"><button class="ok" id="pwOk">כניסה</button><button class="cancel" id="pwCancel">ביטול</button></div>
</dialog>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const ADMIN_PASS='3342';
const COLORS=['blue','red','yellow'],LABELS=['קבוצה 1','קבוצה 2','קבוצה 3'];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* חותמת זמן נוכחית בירושלים כמחרוזת "YYYY-MM-DDTHH:MM" (ניתנת להשוואה לקסיקוגרפית) */
function jerusalemNowStamp(){try{const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>p.find(x=>x.type===t).value;let h=g('hour');if(h==='24')h='00';return `${g('year')}-${g('month')}-${g('day')}T${h}:${g('minute')}`}catch(e){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`}}
function fmtDate(iso){if(!iso)return'';const d=new Date(iso+'T00:00:00');if(isNaN(d))return esc(iso);return d.toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'})}
/* ממיר תאריך+שעה לפי שעון קיר בירושלים ל-epoch (ms) — ללא תלות באזור הזמן של המכשיר */
function jerusalemEpoch(dateISO,hhmm){const [Y,Mo,D]=dateISO.split('-').map(Number);const [h,mi]=hhmm.split(':').map(Number);
 // ננחש epoch, נמדוד את ההיסט של ירושלים באותו רגע, ונתקן
 let guess=Date.UTC(Y,Mo-1,D,h,mi,0);
 for(let i=0;i<2;i++){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(guess));const g=t=>+p.find(x=>x.type===t).value;let gh=g('hour');if(gh===24)gh=0;const asUTC=Date.UTC(g('year'),g('month')-1,g('day'),gh,g('minute'),g('second'));const offset=asUTC-guess;guess=Date.UTC(Y,Mo-1,D,h,mi,0)-offset}
 return guess}

let pub=null,lastSig='',firstLoad=true,countdownTarget=null;
function tickTimer(){
 if(countdownTarget==null){$('tH').textContent='--';$('tM').textContent='--';$('tS').textContent='--';return}
 let diff=Math.max(0,Math.floor((countdownTarget-Date.now())/1000));
 const h=Math.floor(diff/3600),m=Math.floor(diff%3600/60),s=diff%60;
 const z=n=>String(n).padStart(2,'0');
 $('tH').textContent=z(h);$('tM').textContent=z(m);$('tS').textContent=z(s);
 if(diff<=0){countdownTarget=null;render()} // הגיע הזמן — רענון מיידי שיציג כוחות
}
setInterval(()=>{if(countdownTarget!=null&&$('countdown').style.display!=='none')tickTimer()},1000);
function render(){
 if(!pub){$('content').innerHTML='<div class="empty"><span class="big">⚽</span>עדיין לא פורסם מידע למחזור.<br>חזרו בקרוב!</div>';$('countdown').style.display='none';$('round').textContent='';$('date').textContent='';$('title').textContent='כוחות';return}
 $('title').textContent=pub.title||'כוחות';
 $('round').textContent=pub.round?('מחזור מספר '+pub.round):'';
 $('date').textContent=pub.matchDate?fmtDate(pub.matchDate):'';
 const drawTime=/^\d{1,2}:\d{2}$/.test(pub.drawTime||'')?pub.drawTime.padStart(5,'0'):null;
 let timeReached;
 if(pub.forceNow)timeReached=true;
 else if(pub.matchDate&&drawTime)timeReached=jerusalemNowStamp()>=(pub.matchDate+'T'+drawTime);
 else if(drawTime)timeReached=jerusalemNowStamp().slice(11)>=drawTime;
 else timeReached=true;
 const showTeams=!!(pub.published&&pub.teams&&pub.teams.length&&timeReached);
 if(drawTime&&!showTeams){
  $('countdown').style.display='';
  $('drawLabel').innerHTML=(pub.matchDate?'הגרלת כוחות אוטומטית ביום המשחק בשעה ':'הגרלת כוחות אוטומטית בשעה ')+'<b>'+esc(drawTime)+'</b>';
  countdownTarget=pub.matchDate?jerusalemEpoch(pub.matchDate,drawTime):null;
  tickTimer();
 } else {$('countdown').style.display='none';countdownTarget=null}

 if(showTeams){
  $('content').innerHTML='<div class="card"><h2><span class="ico">⚽</span>הכוחות<span class="ico">⚽</span></h2><div class="teams">'+pub.teams.map((g,k)=>`<div class="team ${(pub.colors||COLORS)[k]||COLORS[k]}" style="animation-delay:${k*0.07}s"><h3>${esc(LABELS[k])}</h3>${g.map(n=>`<div class="p">${esc(n)}</div>`).join('')}</div>`).join('')+'</div></div>';
 }else{
  const lineup=pub.lineup||[],guests=pub.guests||[];
  let html='<div class="card"><h2><span class="ico">📋</span>הסגל למחזור</h2>';
  html+=lineup.length?'<ol class="roster-list">'+lineup.map((n,i)=>`<li style="animation-delay:${Math.min(i*0.03,0.5)}s">${esc(n)}</li>`).join('')+'</ol>':'<div class="section-tag">טרם נקבע סגל</div>';
  html+='</div>';
  if(guests.length)html+='<div class="card guests"><h2><span class="ico">➕</span>מזמינים</h2><ol class="roster-list">'+guests.map((n,i)=>`<li style="animation-delay:${Math.min(i*0.03,0.4)}s">${esc(n)}</li>`).join('')+'</ol></div>';
  $('content').innerHTML=html;
 }
 firstLoad=false;
}
async function poll(){try{const r=await fetch('/api/public',{cache:'no-store'});if(r.ok){const data=await r.json();pub=data.publish;const sig=JSON.stringify(pub)+'|'+jerusalemNowStamp();if(sig!==lastSig){lastSig=sig;render()}}}catch(e){if(firstLoad)$('content').innerHTML='<div class="empty"><span class="big">📡</span>אין חיבור כרגע.<br>בודקים שוב…</div>'}}
poll();setInterval(poll,30000);

/* זיהוי מצב אפליקציה מותקנת (כולל iOS) — מסתיר את כניסת המנהל */
const isStandalone=window.matchMedia('(display-mode:standalone)').matches||window.matchMedia('(display-mode:fullscreen)').matches||window.matchMedia('(display-mode:minimal-ui)').matches||navigator.standalone===true;
if(isStandalone)document.body.classList.add('standalone');

/* כניסת מנהל (בדפדפן בלבד) */
$('gear').onclick=()=>{if(isStandalone)return;$('pwInput').value='';$('pwInput').placeholder='••••';$('pwDialog').showModal();setTimeout(()=>$('pwInput').focus(),60)};
$('pwCancel').onclick=()=>$('pwDialog').close();
function tryPw(){if($('pwInput').value===ADMIN_PASS){$('pwDialog').close();location.href='admin.html'}else{$('pwInput').value='';$('pwInput').placeholder='סיסמה שגויה'}}
$('pwOk').onclick=tryPw;
$('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});

/* PWA — service worker + עדכון גרסה */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(reg=>{
 reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)$('updateBar').style.display='flex'})});
}).catch(()=>{});
let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
$('updateBtn').onclick=()=>{navigator.serviceWorker.getRegistration().then(r=>{r&&r.waiting&&r.waiting.postMessage('skipWaiting')})};
}

/* התקנה */
let deferred=null;
const dismissed=localStorage.getItem('install-dismissed');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!dismissed)$('install').style.display='flex'});
$('installYes').onclick=async()=>{$('install').style.display='none';if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null};
$('installNo').onclick=()=>{$('install').style.display='none';localStorage.setItem('install-dismissed','1')};
window.addEventListener('appinstalled',()=>{$('install').style.display='none'});
})();
</script></body></html>
