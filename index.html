<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2947">
<title>כדורגל חמישי/מוצ״ש</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="חמישי/מוצ״ש">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --bg1:#0d2947;--bg2:#17457a;--accent:#39b4ff;
 --card:#ffffff;--ink:#15293f;--muted:#6b7a8d;--line:#eef2f7;
 --blue:#4389d8;--red:#db5460;--yellow:#e3b82b;--orange:#e69533;--white:#a6b2c2;
 --shadow:0 12px 34px rgba(5,20,40,.22);
 --safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{margin:0}
body{font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);min-height:100vh;position:relative;
 background:
  radial-gradient(120% 80% at 50% 0%,#1b4e86 0%,var(--bg1) 55%,#09203b 100%);
 background-attachment:fixed;overflow-x:hidden}
/* שכבת רקע דקורטיבית — קווי מגרש כדורגל וכדורים עדינים */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
 background:
  radial-gradient(circle at 50% 18%,rgba(255,255,255,.08) 0 1px,transparent 2px),
  radial-gradient(circle at 15% 65%,rgba(57,180,255,.10),transparent 28%),
  radial-gradient(circle at 85% 80%,rgba(57,180,255,.08),transparent 30%),
  repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 120px);
}
body::after{content:"⚽";position:fixed;left:-18px;bottom:-14px;font-size:150px;opacity:.05;z-index:0;pointer-events:none;transform:rotate(-12deg)}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:calc(14px + var(--safe-top)) 16px calc(70px + var(--safe-bot))}

/* top bar */
.topbar{display:flex;justify-content:flex-start;align-items:center;min-height:40px}
.gear{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .2s}
.gear:active{transform:scale(.92)}
.gear:hover{background:rgba(255,255,255,.26)}

/* hero */
.hero{text-align:center;color:#fff;margin:2px 0 18px;animation:fadeDown .5s ease both}
.badge-ball{width:74px;height:74px;margin:0 auto 8px;border-radius:22px;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(145deg,#1d4e86,#0d2947);box-shadow:0 8px 22px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15);font-size:38px}
.hero h1{font-size:clamp(25px,7vw,36px);margin:4px 0 2px;font-weight:800;letter-spacing:.5px;text-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .subtitle{font-size:15px;font-weight:600;color:#bfe0ff;opacity:.95;margin-top:4px;line-height:1.5;white-space:pre-line}
.hero .date{font-size:14px;opacity:.75;margin-top:3px}

/* draw note — שורת שעת הגרלה (ללא טיימר) */
.drawnote{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;
 background:linear-gradient(135deg,rgba(57,180,255,.22),rgba(255,255,255,.08));
 border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:14px 18px;margin:0 auto 20px;max-width:460px;text-align:center;
 backdrop-filter:blur(6px);animation:fadeUp .5s .05s ease both}
.drawnote .dico{font-size:22px;flex:0 0 auto}
.drawnote .label{font-size:15px;opacity:.95;letter-spacing:.2px;line-height:1.5;font-weight:600}
.drawnote .label b{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.drawnote .pulse{position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 0%,rgba(57,180,255,.25),transparent);pointer-events:none}

/* cards */
.card{background:var(--card);border-radius:20px;padding:18px 16px;margin:14px 0;box-shadow:var(--shadow);animation:fadeUp .45s ease both}
.card h2{margin:0 0 14px;font-size:20px;text-align:center;color:var(--bg1);display:flex;align-items:center;justify-content:center;gap:8px}
.card h2 .ico{font-size:19px}
.section-tag{display:block;text-align:center;font-size:13px;color:var(--muted);margin:4px 0}

/* roster */
.roster-list{list-style:none;margin:0;padding:0;counter-reset:n}
.roster-list li{counter-increment:n;display:flex;align-items:center;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);font-size:17px;animation:slideIn .4s ease both}
.roster-list li:last-child{border-bottom:0}
.roster-list li::before{content:counter(n);flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#eaf1fb,#dbe8fa);color:var(--bg2);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(67,137,216,.18)}
.roster-list .rn{flex:1 1 auto}
.roster-list .paytag{flex:0 0 auto;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;letter-spacing:.2px}
.roster-list .paytag.paid{background:#d8f5e3;color:#1b7a46;box-shadow:inset 0 0 0 1px rgba(56,179,111,.4)}
.roster-list .paytag.unpaid{background:#ffe3e3;color:#b23140;box-shadow:inset 0 0 0 1px rgba(219,84,96,.35)}
.guests h2{color:#9a6400}
.guests .roster-list li::before{background:linear-gradient(145deg,#fff2d6,#ffe6b3);color:#8a5a00;box-shadow:inset 0 0 0 1px rgba(224,160,40,.25)}

/* teams — זהה לתצוגת האדמין: קבוצה בצבע מלא, גבול צבעוני, שמות בצבע הקבוצה */
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.team{border:2px solid;border-radius:14px;overflow:hidden;min-width:0;box-shadow:0 4px 14px rgba(0,0,0,.08);animation:popIn .4s ease both}
.team h3{margin:0;text-align:center;padding:12px 4px;font-size:16px;font-weight:800;border-bottom:2px solid currentColor}
.team.blue{background:#e5f0ff;color:#144a98;border-color:#4389d8}
.team.red{background:#ffe9e9;color:#a32232;border-color:#db5460}
.team.yellow{background:#fff5cb;color:#775800;border-color:#e3b82b}
.team.orange{background:#fff0da;color:#955000;border-color:#e69533}
.team.white{background:#fff;color:#3c4b5c;border-color:#a6b2c2}
.team .p{padding:10px 4px;text-align:center;color:inherit;border-bottom:1px solid rgba(160,160,160,.25);font-size:14.5px;font-weight:600;overflow-wrap:anywhere}
.team .p:last-child{border-bottom:0}
.jersey-note{margin-top:14px;text-align:center;font-size:16px;color:var(--bg1);background:linear-gradient(135deg,#eaf4ff,#f4f9ff);border:1px solid #cfe2f7;border-radius:12px;padding:12px 14px}
.jersey-note b{font-weight:800;color:var(--bg2)}

/* כפתור הגרלה (מכשיר המנהל בלבד) */
.drawbox{max-width:460px;margin:0 auto 18px;text-align:center;animation:fadeUp .45s ease both}
.draw-btn{width:100%;border:0;border-radius:16px;padding:16px 18px;font-size:21px;font-weight:800;color:#3a2600;cursor:pointer;
 background:linear-gradient(145deg,#ffe27a,#f5b70a);box-shadow:0 10px 26px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .15s,opacity .2s}
.draw-btn:active{transform:scale(.97)}
.draw-btn:disabled{opacity:.55;cursor:wait}
/* הודעה קופצת */
.itoast{position:fixed;left:14px;right:14px;top:calc(14px + var(--safe-top));max-width:460px;margin:0 auto;background:#fff;color:var(--ink);border-radius:14px;padding:13px 16px;font-weight:700;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);z-index:30;display:none;animation:fadeDown .3s ease both}

/* אנימציית הגרלה */
.fx{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:calc(16px + var(--safe-top)) 12px calc(16px + var(--safe-bot));
 background:radial-gradient(85% 60% at 50% 32%,rgba(30,88,150,.94),rgba(4,14,30,.97));backdrop-filter:blur(6px);color:#fff}
.fx.show{display:flex;animation:fxIn .35s ease both}
.fx.out{animation:fxOut .45s ease forwards}
.fx-inner{width:100%;max-width:460px;text-align:center;position:relative;z-index:1}
.fx-ballwrap{display:inline-block;animation:fxBounce .42s ease-in-out infinite alternate}
.fx-ball{display:inline-block;font-size:64px;line-height:1;animation:fxSpin .7s linear infinite;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.fx.done .fx-ballwrap{animation:none}
.fx.done .fx-ball{animation:fxPop .6s cubic-bezier(.2,1.6,.4,1) both}
.fx-title{font-size:24px;font-weight:800;margin:12px 0 16px;letter-spacing:.3px;text-shadow:0 2px 12px rgba(0,0,0,.45);min-height:32px}
.fx.done .fx-title{color:#ffd54a;animation:fxPop .5s cubic-bezier(.2,1.6,.4,1) both}
.fx-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fx-col{--c:#4389d8;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.07);border:2px solid var(--c);animation:fxRise .45s ease both;animation-delay:var(--d)}
.fx-col.blue{--c:#4389d8}.fx-col.red{--c:#db5460}.fx-col.yellow{--c:#e3b82b}.fx-col.orange{--c:#e69533}.fx-col.white{--c:#c9d2dd}
.fx-head{background:var(--c);color:#fff;font-weight:800;font-size:14px;padding:8px 2px}
.fx-col.yellow .fx-head,.fx-col.white .fx-head{color:#2a2000}
.fx-slot{height:34px;display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px;font-weight:600;padding:0 3px;color:rgba(255,255,255,.5);filter:blur(.7px)}
.fx-slot span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.fx-slot.locked{color:#fff;font-weight:800;filter:none;background:rgba(255,255,255,.13);box-shadow:inset 0 0 0 1px var(--c),0 0 16px var(--c);animation:fxLock .45s cubic-bezier(.2,1.6,.4,1) both}
#fxConfetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.fx-hint{font-size:12px;margin-top:14px;opacity:0;transition:opacity .4s}
.fx.done .fx-hint{opacity:.7}
@keyframes fxIn{from{opacity:0}to{opacity:1}}
@keyframes fxOut{to{opacity:0;transform:scale(1.05)}}
@keyframes fxSpin{to{transform:rotate(360deg)}}
@keyframes fxBounce{from{transform:translateY(0)}to{transform:translateY(-16px)}}
@keyframes fxPop{0%{transform:scale(.55)}100%{transform:scale(1)}}
@keyframes fxRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fxLock{0%{transform:scale(1.4)}100%{transform:scale(1)}}

/* skeleton */
.skel{background:var(--card);border-radius:20px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.skel .bar{height:16px;border-radius:8px;margin:12px 0;background:linear-gradient(90deg,#eef2f7 25%,#e2e8f0 50%,#eef2f7 75%);background-size:200% 100%;animation:shimmer 1.3s infinite}
.skel .bar.sm{width:50%;margin-inline:auto}

.empty{text-align:center;color:#fff;opacity:.9;padding:46px 14px;font-size:17px;line-height:1.6}
.empty .big{font-size:40px;display:block;margin-bottom:8px}

/* תשלום — ביט / פייבוקס */
.pay-strip{margin:26px auto 4px;max-width:460px;text-align:center;color:#fff;animation:fadeUp .5s ease both}
.pay-strip .pay-title{font-size:14px;opacity:.85;margin-bottom:11px;letter-spacing:.2px}
.pay-strip .pay-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pay-btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:#15293f;background:#fff;
 border-radius:14px;padding:11px 18px;font-weight:800;font-size:15px;box-shadow:0 8px 22px rgba(0,0,0,.22);transition:transform .15s,box-shadow .15s}
.pay-btn:active{transform:scale(.95)}
.pay-btn:hover{box-shadow:0 10px 26px rgba(0,0,0,.3)}
.pay-btn .ic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff}
.pay-btn.bit .ic{background:linear-gradient(145deg,#00b2b2,#009a9a)}
.pay-btn.paybox .ic{background:linear-gradient(145deg,#e8336d,#c41e5a)}

.foot{text-align:center;color:#ffffff9c;font-size:12px;margin-top:18px}

/* install banner */
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bot));max-width:460px;margin:0 auto;
 display:none;align-items:center;gap:12px;background:#fff;color:var(--ink);border-radius:16px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:20;animation:fadeUp .4s ease both}
.install .ib{width:40px;height:40px;border-radius:11px;flex:0 0 auto}
.install .it{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.install .it small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.install button{border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
.install .yes{background:var(--bg2);color:#fff}
.install .no{background:transparent;color:var(--muted);padding:10px 6px}

/* update toast */
.update{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-bot));max-width:460px;margin:0 auto;display:none;
 align-items:center;gap:10px;background:#17457a;color:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:21;animation:fadeUp .4s ease both}
.update button{margin-inline-start:auto;background:#fff;color:#17457a;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer}

/* dialog */
dialog{border:0;border-radius:18px;padding:22px;max-width:330px;width:88%;box-shadow:0 24px 60px #0006;animation:popIn .25s ease}
dialog::backdrop{background:#000a;backdrop-filter:blur(2px)}
dialog h3{margin:0 0 14px;text-align:center;color:var(--bg1)}
dialog input{width:100%;padding:13px;font-size:20px;text-align:center;border:1.5px solid #c4d0de;border-radius:12px;letter-spacing:6px}
dialog input:focus{outline:0;border-color:var(--accent)}
dialog .row{display:flex;gap:8px;margin-top:14px}
dialog button{flex:1;padding:12px;border:0;border-radius:11px;font-size:15px;font-weight:600;cursor:pointer}
dialog .ok{background:var(--bg2);color:#fff}
dialog .cancel{background:#eef2f7;color:#415}

@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* במצב אפליקציה מותקנת (PWA) מסתירים את כניסת המנהל — זמינה בדפדפן בלבד */
@media(display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){.gear{display:none!important}}
body.standalone .gear{display:none!important}

@media(max-width:520px){
 main{padding:calc(12px + var(--safe-top)) 11px calc(60px + var(--safe-bot))}
 .team h3{font-size:13.5px;padding:10px 2px}
 .team .p{font-size:13px;padding:9px 2px}
 .teams{gap:7px}
 .roster-list li{font-size:16px}
}
</style></head><body><main>
<div class="topbar"><button class="gear" id="gear" title="כניסת מנהל" aria-label="כניסת מנהל">⚙️</button></div>

<div class="hero">
 <div class="badge-ball">⚽</div>

<div class="fx" id="drawFx" aria-hidden="true"><canvas id="fxConfetti"></canvas><div class="fx-inner"><div class="fx-ballwrap"><span class="fx-ball">⚽</span></div><div class="fx-title" id="fxTitle"></div><div class="fx-cols" id="fxCols"></div><div class="fx-hint">לחיצה לסגירה</div></div></div>

 <h3>🔒 כניסת מנהל</h3>
 <input id="pwInput" type="password" inputmode="numeric" placeholder="••••" autocomplete="off">
 <div class="row"><button class="ok" id="pwOk">כניסה</button><button class="cancel" id="pwCancel">ביטול</button></div>
</dialog>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);

/* ממיר תאריך+שעה לפי שעון קיר בירושלים ל-epoch (ms) — ללא תלות באזור הזמן של המכשיר */

 let guess=Date.UTC(Y,Mo-1,D,h,mi,0);
 for(let i=0;i<2;i++){const p=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(new Date(guess));const g=t=>+p.find(x=>x.type===t).value;let gh=g('hour');if(gh===24)gh=0;const asUTC=Date.UTC(g('year'),g('month')-1,g('day'),gh,g('minute'),g('second'));const offset=asUTC-guess;guess=Date.UTC(Y,Mo-1,D,h,mi,0)-offset}
 return guess}

let pub=null,lastSig='',firstLoad=true,revealTimer=null;
function setSubtitle(t){const el=$('subtitle');el.textContent=String(t||'');el.style.display=t?'':'none'}
function render(){
 if(revealTimer){clearTimeout(revealTimer);revealTimer=null}
 if(!pub){$('content').innerHTML='<div class="empty"><span class="big">⚽</span>עדיין לא פורסם מידע למחזור.<br>חזרו בקרוב!</div>';$('drawnote').style.display='none';$('date').textContent='';$('title').textContent='כוחות';setSubtitle('');renderPay();return}
 $('title').textContent=pub.title||'כוחות';
 setSubtitle(pub.subtitle);
 renderPay();
 $('date').textContent=pub.matchDate?fmtDate(pub.matchDate):'';
 const drawTime=/^\d{1,2}:\d{2}$/.test(pub.drawTime||'')?pub.drawTime.padStart(5,'0'):null;
 /* הגרלה במגרש: הכוחות מוצגים רק אחרי "פרסם עכשיו" — שעת ההגרלה לא רלוונטית */
 const atField=!!pub.drawAtField;
 let timeReached;
 if(pub.forceNow)timeReached=true;
 else if(atField)timeReached=false;
 else if(pub.matchDate&&drawTime)timeReached=jerusalemNowStamp()>=(pub.matchDate+'T'+drawTime);
 else if(drawTime)timeReached=jerusalemNowStamp().slice(11)>=drawTime;
 else timeReached=true;
 const showTeams=!!(pub.published&&pub.teams&&pub.teams.length&&timeReached);
 if(!showTeams){
  $('drawnote').style.display='';
  $('drawLabel').textContent='הכוחות יוגרלו במגרש';
  /* מצב רגיל: רענון מיידי כשמגיעה שעת ההגרלה — ללא צורך ברענון ידני */
  if(!atField&&pub.matchDate&&drawTime){const ms=jerusalemEpoch(pub.matchDate,drawTime)-Date.now();if(ms>0&&ms<=24*3600*1000)revealTimer=setTimeout(render,ms+500)}
 } else {$('drawnote').style.display='none'}

 if(showTeams){
  const jersey=(pub.jersey||'').trim();
  $('content').innerHTML='<div class="card"><h2><span class="ico">⚽</span>הכוחות<span class="ico">⚽</span></h2><div class="teams">'+pub.teams.map((g,k)=>`<div class="team ${(pub.colors||COLORS)[k]||COLORS[k]}" style="animation-delay:${k*0.07}s"><h3>${esc(LABELS[k])}</h3>${g.map(n=>`<div class="p">${esc(n)}</div>`).join('')}</div>`).join('')+'</div>'+(jersey?`<div class="jersey-note">🎽 גופיות: <b>${esc(jersey)}</b></div>`:'')+'</div>';
 }else{
  const lineup=pub.lineup||[],guests=pub.guests||[];
  /* פריט יכול להיות מחרוזת (תאימות לאחור) או {name,paid} */
  const nm=x=>typeof x==='string'?x:(x&&x.name)||'';
  const pd=x=>typeof x==='object'&&x&&x.paid;
  const row=(x,i,withPay)=>{const paidBadge=withPay?`<span class="paytag ${pd(x)?'paid':'unpaid'}">${pd(x)?'שולם':'לא שולם'}</span>`:'';return `<li style="animation-delay:${Math.min(i*0.03,0.5)}s"><span class="rn">${esc(nm(x))}</span>${paidBadge}</li>`};
  let html='<div class="card"><h2><span class="ico">📋</span>הסגל למחזור</h2>';
  html+=lineup.length?'<ol class="roster-list with-pay">'+lineup.map((x,i)=>row(x,i,true)).join('')+'</ol>':'<div class="section-tag">טרם נקבע סגל</div>';
  html+='</div>';
  if(guests.length)html+='<div class="card guests"><h2><span class="ico">➕</span>מזמינים</h2><ol class="roster-list">'+guests.map((x,i)=>row(x,i,false)).join('')+'</ol></div>';
  $('content').innerHTML=html;
 }
 firstLoad=false;
}
async function poll(){try{const r=await fetch('/api/public',{cache:'no-store'});if(r.ok){const data=await r.json();pub=data.publish;const sig=JSON.stringify(pub)+'|'+jerusalemNowStamp();if(sig!==lastSig){lastSig=sig;render()}}}catch(e){if(firstLoad)$('content').innerHTML='<div class="empty"><span class="big">📡</span>אין חיבור כרגע.<br>בודקים שוב…</div>'}}
/* ===== כפתור "הגרל" — רק במכשיר של המנהל =====
   מופיע רק אם באדמין במכשיר הזה סומן "כפתור הגרל בדף הציבורי" ויש סיסמת סנכרון.
   קובץ האלגוריתם נטען רק במכשיר הזה. התוצאה מתפרסמת מיד לענן. */
const LS={round:'team-balancer-round-v2',cfg:'team-balancer-cfg-v1',pw:'team-balancer-pw',flag:'index-draw-device'};
let drawBusy=false,toastTimer=null;
const readLS=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const canDraw=()=>localStorage.getItem(LS.flag)==='1'&&!!localStorage.getItem(LS.pw)&&!!window.TeamAlgo;
const localHasTeams=()=>{const r=readLS(LS.round);return !!(r&&Array.isArray(r.teams)&&r.teams.length===3)};
function showMsg(s){const el=$('itoast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',3500)}
function renderDraw(){const box=$('drawbox');if(!canDraw()){box.style.display='none';return}
 box.style.display='';$('drawBtn').textContent=localHasTeams()?'🔁 הגרל שוב':'🎲 הגרל';$('drawBtn').disabled=drawBusy}
/* ===== אנימציית הגרלה (דף ציבורי בלבד) =====
   1) ערבוב: שמות מהסגל רצים בשלוש עמודות בצבעי הקבוצות (ההגרלה רצה ברקע, מינימום 2 שניות)
   2) נעילה: כל שם "ננעל" במקומו בזה אחר זה, עם פופ, זוהר ורטט קצר
   3) סיום: "הכוחות נקבעו!" + קונפטי בצבעי הקבוצות, והמסך נפתח אל הכוחות. לחיצה בסיום סוגרת מיד. */
const FX_HEX={blue:'#4389d8',red:'#db5460',yellow:'#e3b82b',orange:'#e69533',white:'#c9d2dd'};
const fxSleep=ms=>new Promise(r=>setTimeout(r,ms));
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
function confetti(cols){const cv=$('fxConfetti'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,W=cv.width=innerWidth*dpr,H=cv.height=innerHeight*dpr;
 const pal=[...cols.map(c=>FX_HEX[c]||'#fff'),'#ffd54a','#ffffff'];
 /* שני "תותחים" מהפינות התחתונות */
 const ps=Array.from({length:170},(_,i)=>{const left=i%2===0;return{x:left?0:W,y:H*.78,vx:(left?1:-1)*(4+Math.random()*9)*dpr,vy:-(9+Math.random()*12)*dpr,w:(6+Math.random()*7)*dpr,h:(3+Math.random()*5)*dpr,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:pal[i%pal.length]}});
 const t0=performance.now(),DUR=2600;
 (function frame(now){const el=now-t0;ctx.clearRect(0,0,W,H);ctx.globalAlpha=Math.max(0,1-el/DUR);
  for(const p of ps){p.vy+=.32*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()}
  if(el<DUR)requestAnimationFrame(frame);else ctx.clearRect(0,0,W,H)})(t0)}
async function playDrawFx(job,pool,colors,reshuffle,onReveal){
 /* מי שביקש פחות תנועה במכשיר — בלי אנימציה */
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){const p=await job;onReveal(p);return}
 const fx=$('drawFx'),cols=$('fxCols'),title=$('fxTitle'),names=pool.length?pool:['⚽'];
 const slotHtml='<div class="fx-slot"><span></span></div>',per=Math.max(1,Math.ceil(names.length/3));
 cols.innerHTML=colors.map((c,k)=>`<div class="fx-col ${c}" style="--d:${k*.08}s"><div class="fx-head">${esc(LABELS[k])}</div>${slotHtml.repeat(per)}</div>`).join('');
 title.textContent=reshuffle?'מגרילים מחדש…':'מגרילים כוחות…';
 fx.classList.remove('done','out');fx.classList.add('show');
 const rnd=()=>names[Math.floor(Math.random()*names.length)];
 const spin=setInterval(()=>cols.querySelectorAll('.fx-slot:not(.locked) span').forEach(s=>s.textContent=rnd()),70);
 let publish;
 try{[publish]=await Promise.all([job,fxSleep(2000)])}
 catch(e){clearInterval(spin);fx.classList.remove('show');throw e}
 const teams=publish.teams||[];
 /* התאמת מספר השורות לגודל הקבוצות שיצאו */
 [...cols.children].forEach((col,k)=>{const need=(teams[k]||[]).length;let slots=col.querySelectorAll('.fx-slot');
  for(let i=slots.length;i<need;i++)col.insertAdjacentHTML('beforeend',slotHtml);
  for(let i=slots.length-1;i>=need;i--)slots[i].remove()});
 title.textContent='והכוחות הם…';
 const rows=Math.max(0,...teams.map(t=>t.length));
 for(let r=0;r<rows;r++)for(let k=0;k<3;k++){const name=(teams[k]||[])[r];if(name==null)continue;
  await fxSleep(95);const slot=cols.children[k].querySelectorAll('.fx-slot')[r];slot.firstChild.textContent=name;slot.classList.add('locked');buzz(12)}
 clearInterval(spin);
 await fxSleep(250);
 title.textContent='הכוחות נקבעו! 🎉';fx.classList.add('done');buzz([40,60,90]);
 confetti(publish.colors||colors);
 onReveal(publish); /* הכוחות מוצגים כבר מתחת לשכבה */
 await Promise.race([fxSleep(2200),new Promise(res=>{fx.onclick=()=>{if(fx.classList.contains('done'))res()}})]);
 fx.onclick=null;fx.classList.add('out');await fxSleep(450);fx.classList.remove('show','done','out')}
/* ההגרלה: נתונים מהענן ומהאדמין במכשיר → פרסום. מחזירה את הפרסום החדש (בלי להציג) */
async function doDraw(reshuffle,pw,r){
 /* השחקנים והפרסום — מהענן (מקור האמת); מצב המחזור — מהאדמין במכשיר הזה */
 const g=await fetch('/api/players',{headers:{'x-app-password':pw},cache:'no-store'});
 if(g.status===401)throw Error('סיסמת הסנכרון שגויה — היכנס לאדמין');if(!g.ok)throw Error('אין חיבור לענן');
 const data=await g.json(),players=Array.isArray(data.players)?data.players:[];
 const t=TeamAlgo.fromRound(players,r,!reshuffle);
 if(!t)throw Error('אין מספיק שחקנים בסגל');
 const nameOf=new Map(players.map(p=>[p.id,p.name]));
 const colors=Array.isArray(r.teamColors)&&r.teamColors.length===3?r.teamColors:COLORS;
 const publish={...(data.publish||{}),teams:t.map(x=>x.map(i=>nameOf.get(i)||'').filter(Boolean)),colors,published:true,forceNow:true};
 const p=await fetch('/api/players',{method:'POST',headers:{'content-type':'application/json','x-app-password':pw},body:JSON.stringify({players,publish})});
 if(!p.ok)throw Error('הפרסום נכשל');
 /* עדכון מקומי — כך האדמין במכשיר הזה יציג את אותם כוחות (ושם אפשר להחליף ידנית) */
 r.teams=t;r.finalShown=true;localStorage.setItem(LS.round,JSON.stringify(r));
 const c=readLS(LS.cfg)||{};c.published=true;c.forceNow=true;localStorage.setItem(LS.cfg,JSON.stringify(c));
 return publish}
$('drawBtn').onclick=async()=>{if(drawBusy||!canDraw())return;
 const reshuffle=localHasTeams();
 if(!confirm(reshuffle?'להגריל שוב? הכוחות הנוכחיים יוחלפו ויפורסמו מיד.':'להגריל כוחות עכשיו? הכוחות יפורסמו מיד לכולם.'))return;
 const pw=localStorage.getItem(LS.pw),r=readLS(LS.round);
 if(!r||!Array.isArray(r.selected)||r.selected.length<3)return showMsg('אין מספיק שחקנים בסגל — יש לבחור סגל באדמין');
 drawBusy=true;renderDraw();
 /* שמות לאנימציית הערבוב — מהסגל המפורסם */
 const pool=((pub&&pub.lineup)||[]).map(x=>typeof x==='string'?x:x&&x.name).filter(Boolean);
 const colors=Array.isArray(r.teamColors)&&r.teamColors.length===3?r.teamColors:COLORS;
 try{await playDrawFx(doDraw(reshuffle,pw,r),pool,colors,reshuffle,publish=>{pub=publish;lastSig='';render()})}
 catch(e){showMsg(e.message||'ההגרלה נכשלה')}
 finally{drawBusy=false;renderDraw()}};
/* אם האדמין פתוח בלשונית אחרת ושינה משהו — מעדכנים את הכפתור */
window.addEventListener('storage',renderDraw);
/* האלגוריתם נטען רק במכשיר המנהל — אצל אחרים הקובץ לא יורד בכלל */
if(localStorage.getItem(LS.flag)==='1'&&localStorage.getItem(LS.pw)){const s=document.createElement('script');s.src='algo.js';s.onload=renderDraw;document.head.append(s)}
poll();renderDraw();setInterval(()=>{poll();renderDraw()},30000);

/* זיהוי מצב אפליקציה מותקנת (כולל iOS) — מסתיר את כניסת המנהל */
const isStandalone=window.matchMedia('(display-mode:standalone)').matches||window.matchMedia('(display-mode:fullscreen)').matches||window.matchMedia('(display-mode:minimal-ui)').matches||navigator.standalone===true;
if(isStandalone)document.body.classList.add('standalone');

/* כניסת מנהל (בדפדפן בלבד) */
$('gear').onclick=()=>{if(isStandalone)return;$('pwInput').value='';$('pwInput').placeholder='••••';$('pwDialog').showModal();setTimeout(()=>$('pwInput').focus(),60)};
$('pwCancel').onclick=()=>$('pwDialog').close();
function tryPw(){if($('pwInput').value===ADMIN_PASS){$('pwDialog').close();location.href='admin.html'}else{$('pwInput').value='';$('pwInput').placeholder='סיסמה שגויה'}}
$('pwOk').onclick=tryPw;
$('pwInput').addEventListener('keydown',e=>{if(e.key==='Enter')tryPw()});

/* PWA — service worker + עדכון גרסה */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(reg=>{
 reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)$('updateBar').style.display='flex'})});
}).catch(()=>{});
let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload()});
$('updateBtn').onclick=()=>{navigator.serviceWorker.getRegistration().then(r=>{r&&r.waiting&&r.waiting.postMessage('skipWaiting')})};
}

/* תשלום — ביט דרך קישור אישי (מהאדמין); פייבוקס פותח את האפליקציה בלבד */
function renderPay(){
 const bit=(pub&&pub.payBit||'').trim(),box=(pub&&pub.payBox||'').trim();
 const amount=pub&&pub.payAmount!=null?pub.payAmount:null;
 const strip=$('payStrip'),bitEl=$('payBit'),boxEl=$('payBox');
 const ok=u=>/^https?:\/\//i.test(u);
 /* ביט — קישור אישי */
 if(ok(bit)){bitEl.href=bit;bitEl.style.display=''}else{bitEl.style.display='none'}
 /* פייבוקס — אם הוגדר קישור אישי משתמשים בו; אחרת פתיחת האפליקציה בלבד */
 if(ok(box)){boxEl.href=box;boxEl.target='_blank';boxEl.dataset.app='0'}
 else{boxEl.href='#';boxEl.removeAttribute('target');boxEl.dataset.app='1'}
 boxEl.style.display='';
 strip.style.display='';
 $('payTitle').textContent=amount!=null&&amount!==''?('לתשלום - '+amount+' ש"ח'):'לתשלום';
}
/* פתיחת אפליקציית פייבוקס (ללא קישור אישי) — ניסיון סכמה, נפילה לאתר */
$('payBox').addEventListener('click',e=>{
 if($('payBox').dataset.app!=='1')return; /* קישור אישי — פתיחה רגילה */
 e.preventDefault();
 const t=Date.now();
 window.location.href='paybox://';
 setTimeout(()=>{if(Date.now()-t<1600)window.open('https://www.paybox.co.il/','_blank','noopener')},1200);
});

/* התקנה */
let deferred=null;
const dismissed=localStorage.getItem('install-dismissed');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(!dismissed)$('install').style.display='flex'});
$('installYes').onclick=async()=>{$('install').style.display='none';if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null};
$('installNo').onclick=()=>{$('install').style.display='none';localStorage.setItem('install-dismissed','1')};
window.addEventListener('appinstalled',()=>{$('install').style.display='none'});
})();
</script></body></html>
